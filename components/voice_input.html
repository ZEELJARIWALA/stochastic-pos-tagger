<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Input Component</title>
  <style>
    :root {
      --bg-card: #0f172a;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-red: #ef4444;
      --accent-green: #10b981;
    }

    body {
      margin: 0;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      color: var(--text-main);
    }

    .mic-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .mic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .mic-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .badge-info {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .mic-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn-mic {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-mic:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-mic.recording {
      background: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .transcript-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      min-height: 44px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
      color: #e2e8f0;
      white-space: pre-wrap;
    }

    .not-supported {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="mic-card">
    <div class="mic-header">
      <div class="mic-title">
        <span>🎙️ Web Speech Microphone Input</span>
        <span class="badge badge-info">Direct Auto-Tagging</span>
      </div>
    </div>

    <div id="unsupportedNotice" class="not-supported" style="display: none;">
      ⚠️ <strong>Browser Speech Recognition Not Supported:</strong>
      Please use Google Chrome or Microsoft Edge, or type into the transcript box directly.
    </div>

    <div id="supportedContainer">
      <div class="mic-controls">
        <button id="toggleMicBtn" class="btn-mic" type="button">
          <span id="micIcon">🎙️</span>
          <span id="micBtnLabel">Start Speaking</span>
        </button>
        <span id="statusIndicator" class="status-text">Click to speak conversational sentences.</span>
      </div>

      <div class="transcript-box" id="transcriptDisplay">Speak into your mic — on stopping, it processes and tags automatically!</div>
    </div>
  </div>

  <script>
    (function () {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const unsupportedNotice = document.getElementById('unsupportedNotice');
      const supportedContainer = document.getElementById('supportedContainer');
      const toggleBtn = document.getElementById('toggleMicBtn');
      const micBtnLabel = document.getElementById('micBtnLabel');
      const statusIndicator = document.getElementById('statusIndicator');
      const transcriptDisplay = document.getElementById('transcriptDisplay');

      if (!SpeechRecognition) {
        unsupportedNotice.style.display = 'block';
        supportedContainer.style.display = 'none';
        return;
      }

      let recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let isRecording = false;
      let finalTranscript = '';

      function sendTranscriptToParent(text) {
        const cleaned = (text || '').trim();
        if (!cleaned) return;

        // Auto navigate parent with query params to trigger instant Streamlit processing
        try {
          const parentUrl = new URL(window.parent.location.href);
          parentUrl.searchParams.set('spoken', cleaned);
          parentUrl.searchParams.set('t', Date.now().toString());
          window.parent.location.href = parentUrl.toString();
        } catch (e) {
          console.error("Navigation error:", e);
        }
      }

      toggleBtn.addEventListener('click', function () {
        if (!isRecording) {
          finalTranscript = '';
          transcriptDisplay.textContent = 'Listening... Speak naturally with pauses & fillers.';
          try {
            recognition.start();
          } catch (e) {
            console.warn("Recognition already active", e);
          }
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = function () {
        isRecording = true;
        toggleBtn.classList.add('recording');
        micBtnLabel.textContent = 'Stop Recording';
        statusIndicator.textContent = 'Listening... Speak now.';
      };

      recognition.onend = function () {
        isRecording = false;
        toggleBtn.classList.remove('recording');
        micBtnLabel.textContent = 'Start Speaking';

        const transcript = finalTranscript.trim();
        if (transcript) {
          statusIndicator.textContent = '⚡ Speech captured! Processing & Tagging...';
          // Immediately send to Streamlit
          sendTranscriptToParent(transcript);
        } else {
          statusIndicator.textContent = 'No speech detected. Try speaking again.';
        }
      };

      recognition.onerror = function (event) {
        console.error('Speech recognition error:', event.error);
        statusIndicator.textContent = 'Error: ' + event.error;
        isRecording = false;
        toggleBtn.classList.remove('recording');
        micBtnLabel.textContent = 'Start Speaking';
      };

      recognition.onresult = function (event) {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const displayText = (finalTranscript + interimTranscript).trim();
        if (displayText) {
          transcriptDisplay.textContent = displayText;
        }
      };
    })();
  </script>
</body>
</html>
